<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ele é bonzinho</title>
<link rel="stylesheet" href="slides.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&amp;family=Manrope:wght@300..800&amp;family=Caveat:wght@500..700&amp;display=swap">
<style>
body{margin:0}
.tira{width:4440px;display:flex;flex-wrap:wrap;gap:40px}
.vazio{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;box-sizing:border-box;text-align:center;background:repeating-linear-gradient(135deg,#4E2A36 0 30px,#56303D 30px 60px);color:#F7F0E4;font:500 30px/1.35 Manrope,sans-serif}
.vazio b{display:block;font:700 22px/1 Parkinsans,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px;opacity:.75}
.vazio-recorte{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;padding:40px;box-sizing:border-box;text-align:center;border:4px dashed currentColor;border-radius:28px;font:500 26px/1.3 Manrope,sans-serif;opacity:.7}
</style>

<style>body{background:#ddd;padding:40px}</style>
</head>
<body>

<section class="bf-slide bf-slide--creme">
  <i class="bf-onda" style="left:-300px;top:820px;transform:rotate(-6deg)"></i>
  <i class="bf-mancha bf-mancha--2 bf-mancha--salvia" style="right:-80px;bottom:-60px;width:560px;height:640px"></i>
  <img class="bf-personagem bf-contorno" src="imagens/recorte-pitbull-marrom.png" alt="" style="right:90px;bottom:100px;height:620px">
  <i class="bf-adesivo bf-adesivo--coracao bf-adesivo--rosa" style="right:430px;top:620px;transform:rotate(-14deg)"></i>
  <i class="bf-logo"></i><span class="bf-by">by barbara f tatsch</span>
  <span class="bf-handle">//@barbarafonsecavet</span>
  <h1 class="bf-livre bf-manchete bf-gasto" style="left:80px;top:200px;width:920px">"Pode deixar, ele é <span class="bf-mao bf-mao--ameixa">bonzinho.</span>"</h1>
  <div class="bf-livre" style="left:80px;top:470px;width:430px;display:flex;flex-direction:column;gap:22px">
    <p class="bf-punch" style="font-size:44px">Em Curitiba, até o bonzinho vai de guia.</p>
    <p class="bf-texto bf-texto--menor" style="font-size:31px">Desde junho vale a Lei Lili: em parque, praça e rua, cão de qualquer porte anda de coleira e guia.</p>
  </div>
</section>

</body>
</html>
